# Runs on every push and every pull request. What it runs is documented in docs/24-qa-suite.md; the same commands work locally.
#
#   quality  lint, formatting, type check, the unit tests and the image budget (about 1 minute)
#   browser  production build, then the browser checks against it: `npm run qa` (head tags, SEO, 404, keyboard, scroll, resize, axe) and
#            `npm run qa:interact` (tabs, reduced motion)
#
# Not run here: `npm run qa:snapshot` (screenshot comparison). Screenshots differ between operating systems, so a baseline saved on a
# developer machine would never match a CI runner. Use it locally around refactors.
name: CI

on:
  push:
  pull_request:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The values a build needs but that are not secrets here. The home page is static; /admin and /api are dynamic and are not exercised.
  NEXT_PUBLIC_SITE_URL: https://ci.example.com
  PAYLOAD_SECRET: ci-only-secret-not-used-for-anything
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, format, types, tests, images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run images:check

  browser:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next-prod/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      # The checks drive the Google Chrome that GitHub's Ubuntu runners already have (nothing is downloaded).
      - run: google-chrome --version
      - name: Build and serve the production site on port 3002
        run: |
          nohup npm run qa:serve > serve.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fs -o /dev/null http://localhost:3002/; then echo "site is up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the site did not start in 120 s"; cat serve.log; exit 1
      - run: npm run qa
      - run: npm run qa:interact
      - name: Server log
        if: failure()
        run: cat serve.log
